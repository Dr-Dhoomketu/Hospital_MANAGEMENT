openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Patient-facing hospital discovery and booking
  - name: operations
    description: Hospital operations and staff workflows
  - name: patient
    description: Patient portal and clinical timeline
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/services:
    get:
      operationId: listPublicServices
      tags: [public]
      summary: List bookable hospital services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /public/doctors:
    get:
      operationId: listPublicDoctors
      tags: [public]
      summary: List available doctors
      parameters:
        - $ref: "#/components/parameters/DepartmentQuery"
      responses:
        "200":
          description: Doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
  /public/appointments:
    post:
      operationId: createPublicAppointment
      tags: [public]
      summary: Book a patient appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment created with check-in pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid appointment
  /public/appointments/{id}/revisit:
    post:
      operationId: createRevisitAppointment
      tags: [public]
      summary: Create a follow-up appointment from an existing visit
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisitInput"
      responses:
        "201":
          description: Revisit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [operations]
      summary: Get the current operations snapshot
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /patients:
    get:
      operationId: listPatients
      tags: [operations]
      summary: Search and list patients
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [operations]
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
  /patients/{id}:
    get:
      operationId: getPatient
      tags: [operations]
      summary: Get patient profile
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
  /patients/{id}/timeline:
    get:
      operationId: getPatientTimeline
      tags: [patient]
      summary: Get a patient's clinical timeline
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
  /appointments:
    get:
      operationId: listAppointments
      tags: [operations]
      summary: List appointments
      parameters:
        - $ref: "#/components/parameters/DateQuery"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
  /appointments/{id}/status:
    patch:
      operationId: updateAppointmentStatus
      tags: [operations]
      summary: Update appointment status
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentStatusUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /notifications:
    get:
      operationId: listNotifications
      tags: [operations]
      summary: List recent notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
components:
  parameters:
    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
    DepartmentQuery:
      name: department
      in: query
      required: false
      schema:
        type: string
    StatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
    DateQuery:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      required: [id, name, category, description, durationMinutes]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        durationMinutes: { type: integer }
        startingPrice: { type: ["number", "null"] }
    Doctor:
      type: object
      required: [id, name, specialty, department, experienceYears, available]
      properties:
        id: { type: string }
        name: { type: string }
        specialty: { type: string }
        department: { type: string }
        experienceYears: { type: integer }
        available: { type: boolean }
        avatarUrl: { type: ["string", "null"] }
    Patient:
      type: object
      required: [id, patientNumber, name, phone, email, dateOfBirth, gender, status, createdAt]
      properties:
        id: { type: string }
        patientNumber: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date }
        gender: { type: string }
        bloodGroup: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
    PatientInput:
      type: object
      required: [name, phone, email, dateOfBirth, gender]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date }
        gender: { type: string }
        bloodGroup: { type: ["string", "null"] }
    Appointment:
      type: object
      required: [id, appointmentNumber, patientName, doctorName, serviceName, scheduledAt, status, checkInCode]
      properties:
        id: { type: string }
        appointmentNumber: { type: string }
        patientId: { type: ["string", "null"] }
        patientName: { type: string }
        doctorName: { type: string }
        serviceName: { type: string }
        department: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, checked_in, in_consultation, completed, cancelled, no_show] }
        visitType: { type: string, enum: [new, follow_up, revisit] }
        checkInCode: { type: string }
        qrPayload: { type: string }
        notes: { type: ["string", "null"] }
    AppointmentInput:
      type: object
      required: [patientName, phone, email, serviceId, scheduledAt, visitType]
      properties:
        patientName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        email: { type: string, format: email }
        serviceId: { type: string }
        doctorId: { type: ["string", "null"] }
        scheduledAt: { type: string, format: date-time }
        visitType: { type: string, enum: [new, follow_up, revisit] }
        notes: { type: ["string", "null"] }
    RevisitInput:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt: { type: string, format: date-time }
        doctorId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    AppointmentStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [scheduled, checked_in, in_consultation, completed, cancelled, no_show] }
    DashboardSummary:
      type: object
      required: [date, totalPatients, todaysAppointments, pendingAdmissions, emergencyCases, revenue, occupancy]
      properties:
        date: { type: string, format: date }
        totalPatients: { type: integer }
        todaysAppointments: { type: integer }
        pendingAdmissions: { type: integer }
        emergencyCases: { type: integer }
        revenue: { type: number }
        occupancy: { type: number }
        appointmentsByStatus:
          type: object
          additionalProperties: { type: integer }
        recentAppointments:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }
    TimelineEvent:
      type: object
      required: [id, type, title, occurredAt, description]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        doctorName: { type: ["string", "null"] }
    Notification:
      type: object
      required: [id, title, message, type, read, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        type: { type: string, enum: [appointment, billing, clinical, system] }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

